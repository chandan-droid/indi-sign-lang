# E1: GANet-style (GCMM + GAM + GLP + self-attention temporal stage), trained from ImageNet init
seed: 3407
work_dir: work_dir/isl_ganet_s3407
data:
  manifest: data/isl_manifest.csv
  splits: splits/isl_signer_v1.json
  lowercase: true
  max_frames: 160
  flip_p: 0.0
  temporal_scale: true
  scale_range: [0.8, 1.2]
  mask_p: 0.0
model: {
  gcmm: true, 
  gam: true, 
  glp: true, vac: false, attn: true, num_pool: 2, glp_bins: 12, imagenet: true, temporal_mix: true}
loss: {glp: 1.0, vac: 0.0, kd: 0.0}       # paper: CTC:GLP = 1:1
train:
  epochs: 60
  batch_size: 2
  lr: 1.0e-4
  lr_visual: 1.0e-4
  weight_decay: 1.0e-4
  milestones: [30, 45]
  gamma: 0.2
  amp: true
  beam: 10
  num_workers: 4
