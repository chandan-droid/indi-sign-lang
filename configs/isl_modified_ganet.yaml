# Modified GANet Architecture for Continuous Sign Language Recognition
# Pre-trained Stage 1 (from INCLUDE) + Temporal Masking + Mid-stage VAC + BiLSTM-tapped GLP
seed: 3407
work_dir: work_dir/isl_modified_ganet_s3407
data:
  manifest: data/isl_manifest.csv
  splits: splits/isl_signer_v1.json
  lowercase: true
  max_frames: 160
  flip_p: 0.5
  temporal_scale: true
  scale_range: [0.8, 1.2]
  mask_p: 0.25                              # Gentle temporal masking so whole signs aren't erased
  mask_max_drop: 0.15
  mask_chunk: [2, 5]                        # 2 to 5 frames per masked chunk
model:
  gcmm: true
  gam: true
  glp: true
  glp_tap: temporal
  vac: true
  vac_tap: visual
  attn: true
  num_pool: 0                               # No pooling (1x) for ~26-frame ISL sentences (6.2 steps/sign)
  glp_bins: 12
  imagenet: true                            # Fallback initialization for non-SMM layers
  temporal_mix: true
loss:
  glp: 0.5                                  # Balanced global length constraint
  vac: 0.1                                  # Scaled mid-stage CTC loss
  kd: 0.5                                   # Stage-2 to Stage-1 KL self-distillation alignment
pretrained:
  path: work_dir/include_pretrain/include_visual.pt
  transfer_gam: false                       # Transfer SMM handshapes only; let GAM learn sentence context!
  freeze_epochs: 2                          # Brief warmup before joint end-to-end tuning
train:
  epochs: 40
  batch_size: 2                             # Matches original paper & prevents T4 CUDA OOM
  lr: 1.0e-4
  lr_visual: 5.0e-5                         # Allows Stage 1 + GAM to adapt to continuous sentences
  weight_decay: 1.0e-4
  milestones: [20, 30]                      # Gives newly initialized GAM/GCMM 20 full epochs before decay
  gamma: 0.5                                # Gentle 2x step decay instead of aggressive 5x (prevents late relapse)
  amp: true
  beam: 10
  num_workers: 2

