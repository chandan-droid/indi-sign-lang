# E0: plain ResNet-18 + Conv1D + BiLSTM, CTC only (no GCMM/GAM/GLP/VAC/attention)
seed: 3407
work_dir: work_dir/isl_baseline_s3407
data:
  manifest: data/isl_manifest.csv         # id,frame_dir,signer,text  (tools/make_isl_manifest.py)
  splits: splits/isl_signer_v1.json       # frozen split (tools/make_splits.py)
  lowercase: true
  max_frames: 160
  flip_p: 0.0
  temporal_scale: true
  scale_range: [0.8, 1.2]
  mask_p: 0.0                             # temporal masking off (E3 turns it on)
model: {gcmm: false, gam: false, glp: false, vac: false, attn: false, num_pool: 2, glp_bins: 12, imagenet: true}
loss: {glp: 0.0, vac: 0.0, kd: 0.0}
train:
  epochs: 60
  batch_size: 2
  lr: 1.0e-4
  lr_visual: 1.0e-4
  weight_decay: 1.0e-4
  milestones: [30, 45]                    # paper decays at epochs 10 and 20 (100 epochs); tune on dev
  gamma: 0.2
  amp: true
  beam: 10
  num_workers: 4
